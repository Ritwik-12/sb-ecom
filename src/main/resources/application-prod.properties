spring.application.name=sb-ecom

server.port=5000

spring.datasource.url=${DB_URL}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
project.image=images/

spring.jpa.hibernate.ddl-auto=create
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpiration=${JWT_EXPIRATION}
spring.app.jwtCookieName=${JWT_COOKIENAME}

image.base.url=http://localhost:9090/images

#STRIPE KEY
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}


my.variable=prod





