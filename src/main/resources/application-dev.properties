spring.application.name=sb-ecom

server.port=9090


spring.datasource.url=${DB_URL}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}




spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
project.image=images/

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpiration=${JWT_EXPIRATION}
spring.app.jwtCookieName=${JWT_COOKIENAME}


image.base.url=http://localhost:9090/images

#upload image to s3

aws.s3.bucket=${S3_BUCKET_NAME}
aws.s3.region=${S3_BUCKET_REGION}

razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}


#STRIPE KEY
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}



my.variable=dev




