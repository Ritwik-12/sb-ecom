name: AWS OIDC check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Print sub and aud claims
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | python3 -c '
          import sys, base64, json
          s = sys.stdin.read().strip()
          s += "=" * (-len(s) % 4)
          claims = json.loads(base64.urlsafe_b64decode(s))
          print("sub:", claims.get("sub"))
          print("aud:", claims.get("aud"))
          '

      - name: Check secret length (no value is printed)
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          echo "Secret length: ${#ROLE_ARN}"
          echo "Expected length: 52"

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Confirm identity
        run: aws sts get-caller-identity
