name: SB Ecom CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - "feature/**"
      - "ci/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sb-ecom-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recom
          POSTGRES_USER: recom
          POSTGRES_PASSWORD: recom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recom -d recom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: prod

      # application-prod.properties uses ${DB_URL}/${DB_NAME}
      DB_URL: jdbc:postgresql://localhost:5432
      DB_NAME: recom
      DB_USERNAME: recom
      DB_PASSWORD: recom

      # AWS SDK region; CI does not need production AWS credentials
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1
      AWS_EC2_METADATA_DISABLED: "true"
      S3_BUCKET_REGION: ap-south-1
      S3_BUCKET_NAME: ci-test-bucket

      # CI-only dummy application credentials
      JWT_SECRET: Y2ktb25seS1rZXktbm90LWZvci1wcm9kdWN0aW9uLTM0NTY3ODkwYWJjZGVmZ2hpamts
      JWT_EXPIRATION: "86400000"
      JWT_COOKIENAME: testCookie

      RAZORPAY_KEY_ID: ci-test-key
      RAZORPAY_KEY_SECRET: ci-test-secret
      RAZORPAY_WEBHOOK_SECRET: ci-test-webhook

      STRIPE_SECRET_KEY: ci_test_secret
      STRIPE_WEBHOOK_SECRET: ci_test_webhook

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Build and run tests
        run: ./mvnw -B -ntp clean verify

      - name: Prepare deployment JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          JAR_PATH="$(find target -maxdepth 1 -type f \
            -name '*.jar' \
            ! -name '*.original' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)"

          if [[ -z "$JAR_PATH" ]]; then
            echo "ERROR: No application JAR found in target/"
            exit 1
          fi

          mkdir -p deploy-bundle
          cp "$JAR_PATH" deploy-bundle/application.jar

          printf '%s\n' \
            'web: java -Dspring.profiles.active=prod -jar application.jar' \
            > deploy-bundle/Procfile

          cd deploy-bundle
          zip -q ../deployment.zip application.jar Procfile
          cd ..

          test -s deployment.zip
          echo "Prepared deployment package from $JAR_PATH"

      - name: Upload deployment package artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sb-ecom-deployment
          path: deployment.zip
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: build-and-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      EB_APPLICATION_NAME: city-mart-ecom
      EB_ENVIRONMENT_NAME: City-mart-ecom-env
      EB_ARTIFACT_BUCKET: deploy-jar-files

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: sb-ecom-deployment
          path: .

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity --region "$AWS_REGION"

      - name: Create or reuse Elastic Beanstalk application version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_LABEL="sb-ecom-${GITHUB_SHA}"
          ARTIFACT_KEY="deploys/sb-ecom/${VERSION_LABEL}/deployment.zip"

          echo "version_label=$VERSION_LABEL" >> "$GITHUB_OUTPUT"

          EXISTING_VERSION="$(
            aws elasticbeanstalk describe-application-versions \
              --application-name "$EB_APPLICATION_NAME" \
              --version-labels "$VERSION_LABEL" \
              --region "$AWS_REGION" \
              --query 'ApplicationVersions[0].VersionLabel' \
              --output text
          )"

          if [[ "$EXISTING_VERSION" == "$VERSION_LABEL" ]]; then
            echo "Application version $VERSION_LABEL already exists."
            echo "Reusing it without overwriting its S3 source bundle."
            exit 0
          fi

          test -s deployment.zip

          echo "Uploading deployment bundle to S3..."

          aws s3 cp deployment.zip \
            "s3://${EB_ARTIFACT_BUCKET}/${ARTIFACT_KEY}" \
            --region "$AWS_REGION"

          echo "Creating Elastic Beanstalk application version..."

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION_NAME" \
            --version-label "$VERSION_LABEL" \
            --description "GitHub commit ${GITHUB_SHA}" \
            --source-bundle \
              "S3Bucket=${EB_ARTIFACT_BUCKET},S3Key=${ARTIFACT_KEY}" \
            --process \
            --region "$AWS_REGION"

          echo "Created version $VERSION_LABEL"

      - name: Update Elastic Beanstalk environment
        env:
          VERSION_LABEL: ${{ steps.version.outputs.version_label }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(
            aws elasticbeanstalk describe-environments \
              --application-name "$EB_APPLICATION_NAME" \
              --environment-names "$EB_ENVIRONMENT_NAME" \
              --region "$AWS_REGION" \
              --query 'Environments[0].VersionLabel' \
              --output text
          )"

          if [[ "$CURRENT_VERSION" == "$VERSION_LABEL" ]]; then
            echo "Environment already uses version $VERSION_LABEL."
          else
            aws elasticbeanstalk update-environment \
              --application-name "$EB_APPLICATION_NAME" \
              --environment-name "$EB_ENVIRONMENT_NAME" \
              --version-label "$VERSION_LABEL" \
              --region "$AWS_REGION"
          fi

      - name: Wait for environment update
        run: |
          set -euo pipefail

          aws elasticbeanstalk wait environment-updated \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-names "$EB_ENVIRONMENT_NAME" \
            --region "$AWS_REGION"

      - name: Verify deployment health
        shell: bash
        run: |
          set -euo pipefail

          RESULT="$(
            aws elasticbeanstalk describe-environments \
              --application-name "$EB_APPLICATION_NAME" \
              --environment-names "$EB_ENVIRONMENT_NAME" \
              --region "$AWS_REGION" \
              --query 'Environments[0].[Status,Health,VersionLabel]' \
              --output text
          )"

          read -r STATUS HEALTH DEPLOYED_VERSION <<< "$RESULT"

          echo "Status: $STATUS"
          echo "Health: $HEALTH"
          echo "Version: $DEPLOYED_VERSION"

          if [[ "$STATUS" != "Ready" ]]; then
            echo "ERROR: Elastic Beanstalk environment is not Ready."
            exit 1
          fi

          if [[ "$HEALTH" != "Green" && "$HEALTH" != "Yellow" ]]; then
            echo "ERROR: Elastic Beanstalk health is $HEALTH."
            exit 1
          fi

          echo "Deployment verification passed."
