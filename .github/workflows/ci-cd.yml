# .github/workflows/ci-cd.yml

name: CI-CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feature/**'
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  EB_APPLICATION_NAME: city-mart-ecom
  EB_ENVIRONMENT_NAME: City-mart-ecom-env
  EB_ARTIFACT_BUCKET: deploy-jar-files

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://localhost:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: Y2ktb25seS1rZXktbm90LWZvci1wcm9kdWN0aW9uLTM0NTY3ODkwYWJjZGVmZ2hpamts
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1
      AWS_EC2_METADATA_DISABLED: 'true'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Build and run tests
        run: ./mvnw -B -ntp clean verify

      - name: Prepare Elastic Beanstalk package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          JAR_FILE="$(find target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*.original' \
            | head -n 1)"

          if [[ -z "$JAR_FILE" ]]; then
            echo "No application JAR found in target/"
            exit 1
          fi

          mkdir -p eb-package
          cp "$JAR_FILE" eb-package/application.jar

          printf '%s\n' 'web: java -jar application.jar' > eb-package/Procfile

          cd eb-package
          zip -q deployment.zip application.jar Procfile
          cd ..

      - name: Upload deployment package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: eb-deployment-package
          path: eb-package/deployment.zip
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: eb-deployment-package
          path: deployment

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity --region "$AWS_REGION"

      - name: Upload package to S3
        id: upload
        shell: bash
        run: |
          set -euo pipefail

          VERSION_LABEL="sb-ecom-${GITHUB_SHA}"
          ARTIFACT_KEY="deploys/sb-ecom/${VERSION_LABEL}/deployment.zip"

          aws s3 cp deployment/deployment.zip \
            "s3://${EB_ARTIFACT_BUCKET}/${ARTIFACT_KEY}" \
            --region "$AWS_REGION"

          echo "version_label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"
          echo "artifact_key=${ARTIFACT_KEY}" >> "$GITHUB_OUTPUT"

      - name: Create Elastic Beanstalk application version if needed
        shell: bash
        env:
          VERSION_LABEL: ${{ steps.upload.outputs.version_label }}
          ARTIFACT_KEY: ${{ steps.upload.outputs.artifact_key }}
        run: |
          set -euo pipefail

          EXISTING_VERSION="$(
            aws elasticbeanstalk describe-application-versions \
              --application-name "$EB_APPLICATION_NAME" \
              --version-labels "$VERSION_LABEL" \
              --region "$AWS_REGION" \
              --query 'ApplicationVersions[0].VersionLabel' \
              --output text
          )"

          if [[ "$EXISTING_VERSION" == "$VERSION_LABEL" ]]; then
            echo "Application version $VERSION_LABEL already exists."
            echo "Reusing the existing version."
          else
            echo "Creating application version $VERSION_LABEL."

            aws elasticbeanstalk create-application-version \
              --application-name "$EB_APPLICATION_NAME" \
              --version-label "$VERSION_LABEL" \
              --description "GitHub commit $GITHUB_SHA" \
              --source-bundle \
                "S3Bucket=${EB_ARTIFACT_BUCKET},S3Key=${ARTIFACT_KEY}" \
              --process \
              --region "$AWS_REGION"
          fi

      - name: Deploy application version
        env:
          VERSION_LABEL: ${{ steps.upload.outputs.version_label }}
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(
            aws elasticbeanstalk describe-environments \
              --application-name "$EB_APPLICATION_NAME" \
              --environment-names "$EB_ENVIRONMENT_NAME" \
              --region "$AWS_REGION" \
              --query 'Environments[0].VersionLabel' \
              --output text
          )"

          if [[ "$CURRENT_VERSION" == "$VERSION_LABEL" ]]; then
            echo "Environment already uses version $VERSION_LABEL."
          else
            aws elasticbeanstalk update-environment \
              --application-name "$EB_APPLICATION_NAME" \
              --environment-name "$EB_ENVIRONMENT_NAME" \
              --version-label "$VERSION_LABEL" \
              --region "$AWS_REGION"
          fi

      - name: Wait for deployment to finish
        run: |
          set -euo pipefail

          aws elasticbeanstalk wait environment-updated \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-names "$EB_ENVIRONMENT_NAME" \
            --region "$AWS_REGION"

      - name: Verify deployment health
        run: |
          set -euo pipefail

          aws elasticbeanstalk describe-environments \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-names "$EB_ENVIRONMENT_NAME" \
            --region "$AWS_REGION" \
            --query 'Environments[0].[Status,Health,VersionLabel]' \
            --output table
