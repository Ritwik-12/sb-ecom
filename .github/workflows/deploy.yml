name: CI/CD to Elastic Beanstalk

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  EB_APP_NAME: ${{ vars.EB_APP_NAME }}
  EB_ENV_NAME: ${{ vars.EB_ENV_NAME }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sbecom_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL:       - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:postgresql://localhost:5432
          DB_NAME: sbecom_test
          DB_USERNAME: test
          DB_PASSWORD: test
          JWT_SECRET: ci-only-secret-key-that-is-long-enough-for-hs256-signing
          JWT_EXPIRATION: 3600000
          JWT_COOKIENAME: sbecom-ci-jwt
          RAZORPAY_KEY_ID: rzp_test_ci_dummy
          RAZORPAY_KEY_SECRET: ci-dummy-secret
          RAZORPAY_WEBHOOK_SECRET: ci-dummy-webhook-secret
          S3_BUCKET_NAME: ci-dummy-bucket
          S3_BUCKET_REGION: ap-south-1
          STRIPE_SECRET_KEY: sk_test_ci_dummy
          STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
        run: ./mvnw -B verify
          DB_NAME: sbecom_test
          DB_USERNAME: test
          DB_PASSWORD: test
          JWT_SECRET: ci-only-secret-key-that-is-long-enough-for-hs256-signing
          JWT_EXPIRATION: 3600000
          JWT_COOKIENAME: sbecom-ci-jwt
          RAZORPAY_KEY_ID: rzp_test_ci_dummy
          RAZORPAY_KEY_SECRET: ci-dummy-secret
          RAZORPAY_WEBHOOK_SECRET: ci-dummy-webhook-secret
          S3_BUCKET_NAME: ci-dummy-bucket
          S3_BUCKET_REGION: ap-south-1
          STRIPE_SECRET_KEY: sk_test_ci_dummy
          STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
        run: ./mvnw -B verify

  deploy:
    name: Deploy to Elastic Beanstalk
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Build jar
        run: ./mvnw -B package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package application
        run: |
          JAR=$(ls target/*.jar | grep -v '\.original$' | head -n 1)
          echo "Packaging $JAR"
          zip -j deploy.zip "$JAR"

      - name: Upload bundle and create application version
        run: |
          VERSION="v${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          BUCKET=$(aws elasticbeanstalk create-storage-location \
            --query S3Bucket --output text)
          KEY="${EB_APP_NAME}/${VERSION}.zip"

          aws s3 cp deploy.zip "s3://${BUCKET}/${KEY}"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP_NAME" \
            --version-label "$VERSION" \
            --source-bundle S3Bucket="$BUCKET",S3Key="$KEY"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Deploy to environment
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENV_NAME" \
            --version-label "$VERSION"

      - name: Wait until environment is healthy
        run: |
          for i in $(seq 1 60); do
            read STATUS HEALTH LABEL <<< $(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENV_NAME" \
              --query 'Environments[0].[Status,Health,VersionLabel]' \
              --output text)
            echo "Status=$STATUS Health=$HEALTH Version=$LABEL"
            if [ "$STATUS" = "Ready" ] && [ "$LABEL" = "$VERSION" ] && [ "$HEALTH" = "Green" ]; then
              echo "Deployment succeeded"
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for a healthy environment"
          exit 1