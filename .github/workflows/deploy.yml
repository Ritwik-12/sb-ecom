name: Deploy SB Ecom to Elastic Beanstalk

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: sb-ecom-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: build-and-deploy-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verification
        run: ./mvnw -B -ntp clean verify

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --pull -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Create Elastic Beanstalk Docker deployment bundle
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          set -euo pipefail
          mkdir -p deploy-bundle
          printf '{"AWSEBDockerrunVersion":"1","Image":{"Name":"%s","Update":"true"},"Ports":[{"ContainerPort":"5000","HostPort":"80"}]}' "$IMAGE_URI" > deploy-bundle/Dockerrun.aws.json
          (cd deploy-bundle && zip -q ../deployment.zip Dockerrun.aws.json)

      - name: Upload bundle and publish application version
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME }}
          EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
          EB_ARTIFACT_BUCKET: ${{ vars.EB_ARTIFACT_BUCKET }}
          VERSION_LABEL: sb-ecom-${{ github.sha }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          set -euo pipefail
          aws s3 cp deployment.zip "s3://$EB_ARTIFACT_BUCKET/elasticbeanstalk/$EB_APPLICATION_NAME/$VERSION_LABEL/deployment.zip"
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION_NAME" \
            --version-label "$VERSION_LABEL" \
            --description "GitHub commit $GITHUB_SHA; image $IMAGE_URI" \
            --source-bundle S3Bucket="$EB_ARTIFACT_BUCKET",S3Key="elasticbeanstalk/$EB_APPLICATION_NAME/$VERSION_LABEL/deployment.zip"
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --version-label "$VERSION_LABEL"

      - name: Wait for Elastic Beanstalk environment to update
        env:
          EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
        run: |
          set -euo pipefail
          aws elasticbeanstalk wait environment-updated --environment-name "$EB_ENVIRONMENT_NAME"

      - name: Verify Elastic Beanstalk health
        env:
          EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
        run: |
          set -euo pipefail
          STATUS=$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENVIRONMENT_NAME" --query 'Environments[0].Status' --output text)
          HEALTH=$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENVIRONMENT_NAME" --query 'Environments[0].Health' --output text)
          echo "Elastic Beanstalk status: $STATUS"
          echo "Elastic Beanstalk health: $HEALTH"
          test "$STATUS" = "Ready"
          test "$HEALTH" != "Red"
