name: Deploy SB Ecom to Elastic Beanstalk

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: sb-ecom-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: build-and-deploy-jar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verification
        run: ./mvnw -B -ntp clean verify

      - name: Package Elastic Beanstalk Java SE bundle
        run: |
          set -euo pipefail
          mkdir -p deploy-bundle
          JAR_PATH=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$JAR_PATH"
          cp "$JAR_PATH" deploy-bundle/application.jar
          printf '%s\n' 'web: java -Dspring.profiles.active=prod -jar application.jar' > deploy-bundle/Procfile
          (cd deploy-bundle && zip -q -r ../deployment.zip .)

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload bundle and publish application version
        env:
          EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME }}
          EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
          EB_ARTIFACT_BUCKET: ${{ vars.EB_ARTIFACT_BUCKET }}
          VERSION_LABEL: sb-ecom-${{ github.sha }}
        run: |
          set -euo pipefail
          ARTIFACT_KEY="elasticbeanstalk/$EB_APPLICATION_NAME/$VERSION_LABEL/deployment.zip"
          aws s3 cp deployment.zip "s3://$EB_ARTIFACT_BUCKET/$ARTIFACT_KEY"
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION_NAME" \
            --version-label "$VERSION_LABEL" \
            --description "GitHub commit $GITHUB_SHA; Java 21 JAR deployment" \
            --source-bundle S3Bucket="$EB_ARTIFACT_BUCKET",S3Key="$ARTIFACT_KEY"
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --version-label "$VERSION_LABEL"

      - name: Wait for Elastic Beanstalk environment to update
        env:
          EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
        run: |
          set -euo pipefail
          aws elasticbeanstalk wait environment-updated --environment-name "$EB_ENVIRONMENT_NAME"

      - name: Verify Elastic Beanstalk health
        env:
          EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
        run: |
          set -euo pipefail
          STATUS=$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENVIRONMENT_NAME" --query 'Environments[0].Status' --output text)
          HEALTH=$(aws elasticbeanstalk describe-environments --environment-names "$EB_ENVIRONMENT_NAME" --query 'Environments[0].Health' --output text)
          echo "Elastic Beanstalk status: $STATUS"
          echo "Elastic Beanstalk health: $HEALTH"
          test "$STATUS" = "Ready"
          test "$HEALTH" != "Red"
