name: Backend CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: backend-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recom
          POSTGRES_USER: recom
          POSTGRES_PASSWORD: recom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recom -d recom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://localhost:5432
      DB_NAME: recom
      DB_USERNAME: recom
      DB_PASSWORD: recom
      JWT_SECRET: Y2ktb25seS1rZXktbm90LWZvci1wcm9kdWN0aW9uLTM0NTY3ODkwYWJjZGVmZ2hpamts
      JWT_EXPIRATION: "86400000"
      JWT_COOKIENAME: testCookie
      S3_BUCKET_NAME: ci-test-bucket
      S3_BUCKET_REGION: ap-south-1
      RAZORPAY_KEY_ID: ci-test-key
      RAZORPAY_KEY_SECRET: ci-test-secret
      RAZORPAY_WEBHOOK_SECRET: ci-test-webhook
      STRIPE_SECRET_KEY: ci_test_secret
      STRIPE_WEBHOOK_SECRET: ci_test_webhook

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B -ntp clean verify
